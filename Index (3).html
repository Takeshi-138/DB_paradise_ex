<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBパラダイス</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700&family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --c1:#f49325; --c2:#050505; --c3:#1c8906; --text:#1a1a1a;
  --c1-soft:rgba(244,147,37,0.1); --c2-soft:rgba(5,5,5,0.1); --c3-soft:rgba(28,137,6,0.1);
  --muted:#000000; --border:#E8E8E8; --bg:#FFFFFF; --surface:#ffffff; --radius:16px;
  --heading-font:'M PLUS Rounded 1c',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'M PLUS Rounded 1c',sans-serif;background:#fbfde8;color:var(--text);min-height:100vh}
header{background:#f36c12;border-bottom:2px solid var(--c1);padding:1.1rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{width:80px;height:80px;object-fit:contain}
.header-title{font-size:32px;font-weight:700;color:var(--text);font-family:var(--heading-font)}
.header-sub{font-size:13.7px;color:#ffffff;margin-top:1px}
.main-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 2rem;background:#f36c12;overflow-x:auto}
.main-tab-btn{background:none;border:none;cursor:pointer;font-size:13.7px;color:var(--muted);padding:13px 20px;border-bottom:3px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap;font-family:inherit}
.main-tab-btn.active{color:var(--c1);border-bottom-color:var(--c1);font-weight:700}
.main-panel{display:none;padding:1.75rem 2rem;max-width:1140px;margin:0 auto}
.main-panel.active{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1.1rem;border-top:3px solid var(--c1)}
.stat:nth-child(2){border-top-color:var(--c2)} .stat:nth-child(3){border-top-color:var(--c3)} .stat:nth-child(4){border-top-color:var(--c1)}
.stat-label{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.stat-val{font-size:23.1px;font-weight:700;color:var(--text);font-family:var(--heading-font)}
.controls{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.controls input,.controls select{padding:9px 13px;border:1px solid var(--border);border-radius:var(--radius);font-size:13.7px;font-family:inherit;background:#fff;color:var(--text);outline:none}
.controls input{flex:1.4;min-width:180px} .controls select{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem;cursor:pointer;transition:box-shadow .2s;border-left:4px solid var(--c1)}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.card:nth-child(3n+2){border-left-color:var(--c2)} .card:nth-child(3n+3){border-left-color:var(--c3)}
.card-id{font-size:10.5px;color:var(--muted);margin-bottom:5px}
.card-name{font-size:17.9px;font-weight:700;color:var(--text);margin-bottom:2px;font-family:var(--heading-font)}
.card-role{font-size:12.6px;color:var(--muted);margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10.5px;padding:3px 10px;border-radius:20px}
.tag.industry{background:var(--c1-soft);color:var(--c1)} .tag.area{background:var(--c3-soft);color:var(--c3)}
.empty{text-align:center;padding:4rem;color:var(--muted);font-size:13.7px;background:var(--surface);border-radius:var(--radius)}
.loading{text-align:center;padding:4rem;color:var(--muted);font-size:13.7px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:2rem;width:min(500px,100%);max-height:88vh;overflow-y:auto;position:relative;border-top:4px solid var(--c1)}
.modal-close{position:absolute;top:16px;right:16px;background:var(--surface);border:none;cursor:pointer;width:28px;height:28px;border-radius:50%;font-size:13.7px;color:var(--muted)}
.modal-id{font-size:10.5px;color:var(--muted);margin-bottom:6px}
.modal-name{font-size:23.1px;font-weight:700;margin-bottom:2px;font-family:var(--heading-font)}
.modal-role{font-size:12.6px;color:var(--c1);font-weight:700;margin-bottom:1.5rem}
.detail-section{margin-bottom:1.25rem}
.detail-section-title{font-size:11.6px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.5rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);font-weight:700}
.detail-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.7px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--muted);min-width:110px;flex-shrink:0;font-size:11.6px;padding-top:1px}
.detail-val{color:var(--text);word-break:break-word;line-height:1.7;white-space:pre-wrap}
.contact-btn{display:inline-flex;align-items:center;gap:7px;margin-top:.5rem;margin-right:.5rem;font-size:11.6px;padding:8px 16px;color:#fff;border-radius:var(--radius);text-decoration:none;font-weight:700}
.event-typetabs{display:flex;gap:8px;margin-bottom:1.5rem}
.event-typetab-btn{background:none;border:1px solid var(--border);cursor:pointer;font-size:13.7px;color:var(--muted);padding:9px 22px;border-radius:20px;font-family:inherit}
.event-typetab-btn.offline-active{background:var(--c2);border-color:var(--c2);color:#fff}
.event-typetab-btn.online-active{background:var(--c3);border-color:var(--c3);color:#fff}
.event-typepanel{display:none} .event-typepanel.active{display:block}
.event-subtabs{display:flex;gap:6px;margin-bottom:1.5rem}
.event-subtab-btn{background:none;border:1px solid var(--border);cursor:pointer;font-size:13.7px;color:var(--muted);padding:7px 18px;border-radius:20px;font-family:inherit}
.event-subtab-btn.active-offline{border-color:var(--c2);color:var(--c2);font-weight:700}
.event-subtab-btn.active-online{border-color:var(--c3);color:var(--c3);font-weight:700}
.event-subpanel{display:none} .event-subpanel.active{display:block}
.event-month-label{font-size:21.0px;font-weight:700;margin-bottom:1.25rem}
.event-month-label.offline-color{color:var(--c2)} .event-month-label.online-color{color:var(--c3)}
.event-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.event-card{background:#fff;padding:1.1rem 1.3rem;display:flex;gap:1.25rem;border-bottom:1px solid var(--border)}
.event-card:last-child{border-bottom:none}
.event-date-block{flex-shrink:0;width:80px;text-align:center;border-right:1px solid var(--border);padding-right:1.1rem}
.event-date-day{font-size:25.2px;font-weight:700}
.event-date-weekday{font-size:11.6px;color:var(--muted);margin-top:2px}
.event-date-time{font-size:10.5px;font-weight:700;margin-top:8px}
.event-date-time.offline-color{color:var(--c2)} .event-date-time.online-color{color:var(--c3)}
.event-name{font-size:15.8px;font-weight:700;margin-bottom:6px;font-family:var(--heading-font)}
.badge{font-size:10.5px;padding:3px 10px;border-radius:10px;background:#F0F0F0;color:var(--muted)}
.badge.price{background:var(--c2-soft);color:var(--c2)} .badge.price.online-color{background:var(--c3-soft);color:var(--c3)}
.event-desc{font-size:12.6px;color:var(--muted);margin-bottom:10px}
.event-link{display:inline-flex;align-items:center;gap:6px;font-size:12.1px;padding:7px 16px;color:#fff;border-radius:var(--radius);text-decoration:none;font-weight:700}
.terms-box{max-width:500px;margin:2.5rem auto 0;text-align:center}
.terms-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem}
.terms-link-btn{display:inline-flex;padding:12px 28px;background:var(--c1);color:#fff;border-radius:var(--radius);text-decoration:none;font-size:13.7px;font-weight:700}
.site-footer{text-align:center;padding:1.5rem 1rem;font-size:10.5px;color:#AAAAAA;border-top:1px solid var(--border);margin-top:1rem}
</style>
</head>

  </header>
  <div class="main-tabs">
    <button class="main-tab-btn active" id="mainTabMembers" onclick="switchMainTab('members')">登録者一覧</button>
    <button class="main-tab-btn" id="mainTabEvents" onclick="switchMainTab('events')">交流会</button>
    <button class="main-tab-btn" id="mainTabTerms" onclick="switchMainTab('terms')">利用規約</button>
  </div>
  <div class="main-panel active" id="panelMembers">
    <div class="stats">
      <div class="stat"><div class="stat-label">総登録者数</div><div class="stat-val" id="totalCount">–</div></div>
      <div class="stat"><div class="stat-label">表示中</div><div class="stat-val" id="showCount">–</div></div>
      <div class="stat"><div class="stat-label">業界数</div><div class="stat-val" id="industryCount">–</div></div>
      <div class="stat"><div class="stat-label">都道府県</div><div class="stat-val" id="areaCount">–</div></div>
    </div>
    <div class="controls">
      <input id="searchInput" placeholder="名前・業界で検索…" oninput="renderGrid()"/>
      <select id="areaFilter" onchange="renderGrid()"><option value="">都道府県（全て）</option></select>
      <select id="industryFilter" onchange="renderGrid()"><option value="">業界（全て）</option></select>
    </div>
    <div id="grid" class="grid"><div class="loading">読み込み中…</div></div>
  </div>
  <div class="main-panel" id="panelEvents"><div id="eventsContent"><div class="loading">読み込み中…</div></div></div>

    <div class="terms-box"><h2>利用規約</h2>
      <div class="terms-card"><p>本サービスの利用規約は以下のリンクよりご確認いただけます。</p>
        <a class="terms-link-btn" href="#" target="_blank" rel="noopener">利用規約はこちら　→</a>
      </div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal"><button class="modal-close" onclick="closeModal()">✕</button><div id="modalContent"></div></div>
</div>

<script>
const GAS_URL = 'YOUR_GAS_URL_HERE';
const CONTACT_COLORS = {"LINE":"#06C755","Instagram":"#C13584","X（Twitter）":"#000000","Facebook":"#1877F2","TikTok":"#000000","YouTube":"#FF0000","LinkedIn":"#0A66C2","Threads":"#000000","WhatsApp":"#25D366","Discord":"#5865F2","メール":"#6B7280","その他URL":"#9096A6"};
let allData=[], eventsData=null, eventsLoaded=false;

const PANELS=['Members','Events','Terms'];
function switchMainTab(which){
  PANELS.forEach(p=>{
    document.getElementById('mainTab'+p)?.classList.toggle('active',p.toLowerCase()===which);
    document.getElementById('panel'+p)?.classList.toggle('active',p.toLowerCase()===which);
  });
  if(which==='events'&&!eventsLoaded)loadEvents();
}

async function loadMembers(){
  try{
    const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'getMembers'})});
    const data=await res.json();
    if(data.success){
      allData=data.members;
      populateFilters();renderGrid();
      document.getElementById('headerSub').textContent=`${allData.length}名の登録者`;
    }
  }catch(e){document.getElementById('grid').innerHTML='<div class="empty">データの読み込みに失敗しました</div>';}
}
function populateFilters(){
  const industries=new Set(),areas=new Set();
  allData.forEach(r=>{ if(r['業界'])industries.add(r['業界']); if(r['都道府県'])areas.add(r['都道府県']); });
  fillSelect('industryFilter',industries,'業界（全て）');
  fillSelect('areaFilter',areas,'都道府県（全て）');
  document.getElementById('totalCount').textContent=allData.length;
  document.getElementById('industryCount').textContent=industries.size;
  document.getElementById('areaCount').textContent=areas.size;
}
function fillSelect(id,set,ph){
  const el=document.getElementById(id);
  el.innerHTML=`<option value="">${ph}</option>`;
  [...set].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);});
}
function renderGrid(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const industry=document.getElementById('industryFilter').value;
  const area=document.getElementById('areaFilter').value;
  const f=allData.filter(r=>{
    if(industry&&r['業界']!==industry)return false;
    if(area&&r['都道府県']!==area)return false;
    if(q){const h=((r['氏名（カタカナ）']||'')+(r['業界']||'')).toLowerCase();if(!h.includes(q))return false;}
    return true;
  });
  document.getElementById('showCount').textContent=f.length;
  const grid=document.getElementById('grid');
  if(!f.length){grid.innerHTML='<div class="empty">該当する登録者が見つかりません</div>';return;}
  grid.innerHTML=f.map(r=>{
    const name=r['氏名（カタカナ）']||'名前なし';
    const tags=[];
    if(r['業界'])tags.push('<span class="tag industry">'+r['業界']+'</span>');
    if(r['都道府県'])tags.push('<span class="tag area">'+r['都道府県']+'</span>');
    const idLine = r['ID'] ? '<div class="card-id">ID: '+r['ID']+'</div>' : '';
    return `<div class="card" onclick="showModal(${allData.indexOf(r)})">
      ${idLine}
      <div class="card-name">${name}</div>
      <div class="card-role">${[r['都道府県'],r['職種']].filter(Boolean).join(' / ')||'\u3000'}</div>
      ${tags.length?'<div class="tags">'+tags.join('')+'</div>':''}
    </div>`;
  }).join('');
}
function row(label,val){if(val===''||val===null||val===undefined)return'';return `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-val">${val}</span></div>`;}
function showModal(idx){
  const r=allData[idx];
  const name=r['氏名（カタカナ）']||'名前なし';
  const regId=r['ID']||'';
  let html=`
    ${regId?'<div class="modal-id">ID: '+regId+'</div>':''}
    <div class="modal-name">${name}</div>
    <div class="modal-role">${[r['業界'],r['職種']].filter(Boolean).join(' / ')||'\u3000'}</div>
    <div class="detail-section"><div class="detail-section-title">詳細情報</div>
      row('年齢',r['年齢'])row('性別',r['性別'])row('都道府県',r['都道府県'])row('業界',r['業界'])row('職種',r['職種'])row('事業内容',r['事業内容'])row('副業内容',r['副業内容'])row('繋がりたい人脈',r['繋がりたい人脈'])
    </div>`;
  const contacts=[];
  for(let i=1;i<=10;i++){
    const type=r['連絡先'+i+'種別'], url=r['連絡先'+i+'URL'];
    if(type&&url) contacts.push({type,url});
  }
  if(contacts.length){
    html+='<div class="detail-section"><div class="detail-section-title">連絡先</div><div style="margin-top:.5rem">'+
      contacts.map(c=>{
        const col=CONTACT_COLORS[c.type]||'#9096A6';
        return '<a class="contact-btn" style="background:'+col+'" href="'+c.url+'" target="_blank" rel="noopener">'+c.type+'</a>';
      }).join('')+'</div></div>';
  }
  document.getElementById('modalContent').innerHTML=html;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}


async function loadEvents(){
  try{
    const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'getEvents'})});
    const data=await res.json();
    if(data.success){eventsData=data;eventsLoaded=true;renderEvents();}
    else{document.getElementById('eventsContent').innerHTML='<div class="empty">交流会情報の読み込みに失敗しました</div>';}
  }catch(e){document.getElementById('eventsContent').innerHTML='<div class="empty">交流会情報の読み込みに失敗しました</div>';}
}
function formatPrice(val){
  if(val===''||val===null||val===undefined)return '';
  const s=String(val).trim();
  if(/^\d+$/.test(s)){const num=parseInt(s,10); if(num===0)return '無料'; return num.toLocaleString('ja-JP')+'円';}
  return s;
}
function renderEvents(){
  if(!eventsData)return;
  const{offline,online}=eventsData;
  function renderTypePanel(prefix,data,colorClass){
    return `<div class="event-subtabs">
      <button class="event-subtab-btn active-${colorClass}" id="subTab_${prefix}_this" onclick="switchEventSubTab('${prefix}','this','${colorClass}')">${data.thisMonth.month||'-'}月</button>
      <button class="event-subtab-btn" id="subTab_${prefix}_next" onclick="switchEventSubTab('${prefix}','next','${colorClass}')">${data.nextMonth.month||'-'}月</button>
    </div>
    <div class="event-subpanel active" id="subPanel_${prefix}_this"><div class="event-month-label ${colorClass}-color">${data.thisMonth.month||'-'}月の交流会</div>${renderEventList(data.thisMonth.events,colorClass)}</div>
    <div class="event-subpanel" id="subPanel_${prefix}_next"><div class="event-month-label ${colorClass}-color">${data.nextMonth.month||'-'}月の交流会</div>${renderEventList(data.nextMonth.events,colorClass)}</div>`;
  }
  document.getElementById('eventsContent').innerHTML=`
    <div class="event-typetabs">
      <button class="event-typetab-btn offline-active" id="typeTabOffline" onclick="switchEventTypeTab('offline')">オフライン</button>
      <button class="event-typetab-btn" id="typeTabOnline" onclick="switchEventTypeTab('online')">オンライン</button>
    </div>
    <div class="event-typepanel active" id="typePanelOffline">${renderTypePanel('offline',offline,'offline')}</div>
    <div class="event-typepanel" id="typePanelOnline">${renderTypePanel('online',online,'online')}</div>`;
}
function renderEventList(events,colorClass){
  if(!events||!events.length)return'<div class="empty">予定されている交流会はありません</div>';
  const linkColor = colorClass==='offline' ? 'var(--c2)' : 'var(--c3)';
  return`<div class="event-list">${events.map(ev=>{
    const dateStr=String(ev['日付']||'');
    const dm=dateStr.match(/^(\d{4})-(\d{2})-(\d{2})/);
    const dayDisplay=dm?String(parseInt(dm[3],10)):dateStr;
    const capVal=ev['定員'];
    const cap=(capVal!==''&&capVal!==null&&capVal!==undefined)?'<span class="badge">定員 '+capVal+(String(capVal).includes('名')?'':'名')+'</span>':'';
    const priceText=formatPrice(ev['参加費']);
    const price=priceText?'<span class="badge price '+(colorClass==='online'?'online-color':'')+'">'+priceText+'</span>':'';
    return`<div class="event-card">
      <div class="event-date-block"><div class="event-date-day">${dayDisplay}</div><div class="event-date-weekday">${ev['曜日']||''}</div>
      ${ev['開始時間']?'<div class="event-date-time '+colorClass+'-color">'+ev['開始時間']+(ev['終了時間']?'〜'+ev['終了時間']:'')+'</div>':''}</div>
      <div class="event-info"><div class="event-name">${ev['交流会名']||''} ${cap}${price}</div>
      ${ev['交流会の説明']?'<div class="event-desc">'+ev['交流会の説明']+'</div>':''}
      ${ev['URL']?'<a class="event-link" style="background:'+linkColor+'" href="'+ev['URL']+'" target="_blank" rel="noopener">詳細・申し込み</a>':''}</div>
    </div>`;
  }).join('')}</div>`;
}
function switchEventTypeTab(which){
  document.getElementById('typeTabOffline').classList.toggle('offline-active',which==='offline');
  document.getElementById('typeTabOnline').classList.toggle('online-active',which==='online');
  document.getElementById('typePanelOffline').classList.toggle('active',which==='offline');
  document.getElementById('typePanelOnline').classList.toggle('active',which==='online');
}
function switchEventSubTab(prefix,which,colorClass){
  ['this','next'].forEach(w=>{
    document.getElementById(`subTab_${prefix}_${w}`)?.classList.toggle(`active-${colorClass}`,w===which);
    document.getElementById(`subPanel_${prefix}_${w}`)?.classList.toggle('active',w===which);
  });
}


loadMembers();
</script>
